<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ 404 - Config Not Found | FOUR SEVEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #050b14 0%, #071120 100%);
            color: white;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 40px;
            max-width: 600px;
        }
        .skull {
            font-size: 8rem;
            animation: float 3s infinite ease-in-out;
            filter: drop-shadow(0 0 20px #00bfff);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 6rem;
            color: #ff3b30;
            text-shadow: 0 0 20px #ff3b30;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 2rem;
            color: #00bfff;
            margin-bottom: 20px;
        }
        p {
            color: #9aa4b2;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, #00bfff, #0077ff);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0,191,255,0.5);
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="skull">☠️</div>
        <h1>404</h1>
        <h2>CONFIG FILE LOST</h2>
        <p>The configuration file you're looking for has been disconnected.<br><br>
        Possible reasons:<br>
        • File was deleted or moved<br>
        • Link expired<br>
        • You typed the wrong URL<br>
        • The config was too powerful 😈</p>
        <a href="/" class="btn">🏠 RETURN TO FOUR SEVEN HUB</a>
    </div>
</body>
</html>
